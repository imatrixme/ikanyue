name: gateway

on:
  push:
    branches: [master]
    paths:
      - kanyue.gateway/**
      - scripts/gateway-*
      - ikanyue.taro3/utils/**
      - compose.yaml
      - .github/workflows/gateway.yml
  pull_request:
    paths:
      - kanyue.gateway/**
      - scripts/gateway-*
      - ikanyue.taro3/utils/**
      - compose.yaml
      - .github/workflows/gateway.yml

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanyue.gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: kanyue.gateway/go.mod
          cache-dependency-path: kanyue.gateway/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: GOMAXPROCS=1 go vet -p 1 ./...
      - name: test
        run: GOMAXPROCS=1 TZ=Asia/Shanghai go test -p 1 -parallel 1 ./...
      - name: govulncheck
        # Fails on any reachable vulnerability not listed in govulncheck-accepted.txt.
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > "$RUNNER_TEMP/vuln.json"
          jq -r 'select(.finding and .finding.trace[0].function != null) | .finding.osv' "$RUNNER_TEMP/vuln.json" | sort -u > "$RUNNER_TEMP/found"
          { grep -oE '^GO-[0-9]+-[0-9]+' govulncheck-accepted.txt || true; } | sort -u > "$RUNNER_TEMP/accepted"
          for id in $(comm -13 "$RUNNER_TEMP/found" "$RUNNER_TEMP/accepted"); do echo "::warning::$id is no longer reported; remove it from govulncheck-accepted.txt"; done
          unaccepted=$(comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/accepted")
          if [ -n "$unaccepted" ]; then
            for id in $unaccepted; do echo "::error::reachable vulnerability $id (https://pkg.go.dev/vuln/$id)"; done
            exit 1
          fi

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanyue.gateway/console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kanyue.gateway/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: exposure list matches the mini program
        run: node --test scripts/gateway-exposure.test.mjs
      - name: rollout plan
        run: node --test scripts/gateway-rollout.test.mjs
      - name: target-machine drills
        run: node --test scripts/gateway-drill.test.mjs
