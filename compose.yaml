services:
  # The single business binary: API, embedded PocketBase and the admin SPA. ADMIN_PORT
  # (admin domain), API_PORT (API domain) and POCKETBASE_PORT (data domain, public file
  # downloads) all reach it; the PocketBase REST API and dashboard answer only direct
  # private-network calls (SSH tunnel, compose network), never proxied traffic.
  server:
    build:
      context: ./kanyue.server
      dockerfile: Dockerfile
      additional_contexts:
        console: ./ikanyue.admin
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-8080}:8090"
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-${HONO_PORT:-1337}}:8090"
      - "${BIND_ADDR:-127.0.0.1}:${POCKETBASE_PORT:-8090}:8090"
    environment:
      PB_EMAIL: "${PB_EMAIL:-admin@example.com}"
      PB_PASSWORD: "${PB_PASSWORD:-change-me}"
      PB_PUBLIC_URL: "${PB_PUBLIC_URL:-https://data.ikanyue.com}"
      JWT_SECRET: "${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}"
      OPS_REGISTRATION_ENABLED: "${OPS_REGISTRATION_ENABLED:-false}"
      # Release stages are switched on independently (default on outside production).
      NODE_ENV: "${NODE_ENV:-production}"
      COURSE_CREDIT_GRANTS_ENABLED: "${COURSE_CREDIT_GRANTS_ENABLED:-false}"
      COURSE_CREDIT_RESERVATION_ENABLED: "${COURSE_CREDIT_RESERVATION_ENABLED:-false}"
      COURSE_CREDIT_SETTLEMENT_ENABLED: "${COURSE_CREDIT_SETTLEMENT_ENABLED:-false}"
      COURSE_CREDIT_MIGRATION_ENABLED: "${COURSE_CREDIT_MIGRATION_ENABLED:-false}"
      # Online purchase needs the payment gateway; only "true" enables it. Mock payment never runs in production.
      COURSE_COMMERCE_ENABLED: "${COURSE_COMMERCE_ENABLED:-false}"
      PAY_GATEWAY_URL: "${PAY_GATEWAY_URL:-}"
      PAY_SERVICE_TOKEN: "${PAY_SERVICE_TOKEN:-}"
      PAY_EVENT_TOKEN: "${PAY_EVENT_TOKEN:-}"
      # Outbox events go to this signed webhook every minute; URL and secret are set together or not at all.
      COURSE_CREDIT_OUTBOX_WEBHOOK_URL: "${COURSE_CREDIT_OUTBOX_WEBHOOK_URL:-}"
      COURSE_CREDIT_OUTBOX_WEBHOOK_SECRET: "${COURSE_CREDIT_OUTBOX_WEBHOOK_SECRET:-}"
      COURSE_CREDIT_OUTBOX_WEBHOOK_TIMEOUT_MS: "${COURSE_CREDIT_OUTBOX_WEBHOOK_TIMEOUT_MS:-}"
      PUBLIC_ASSET_BASE_URL: "${PUBLIC_ASSET_BASE_URL:-https://kyoss.abcmem.com/ikanyue-mp}"
      DEFAULT_AVATAR: "${DEFAULT_AVATAR:-}"
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_SECRET: "${WECHAT_SECRET:-}"
      WECHAT_JSCODE2SESSION: "${WECHAT_JSCODE2SESSION:-https://api.weixin.qq.com/sns/jscode2session}"
      # Renewal reminders by subscribe message; a blank template id records every attempt as skipped.
      WECHAT_RENEWAL_TEMPLATE_ID: "${WECHAT_RENEWAL_TEMPLATE_ID:-}"
      WECHAT_RENEWAL_TEMPLATE_DATA: "${WECHAT_RENEWAL_TEMPLATE_DATA:-}"
      WECHAT_MINIPROGRAM_STATE: "${WECHAT_MINIPROGRAM_STATE:-formal}"
      # Registration with the API gateway (profile "gateway"): set GATEWAY_URL=http://gateway:1461.
      GATEWAY_URL: "${GATEWAY_URL:-}"
      GATEWAY_REGISTRATION_TOKEN: "${GATEWAY_REGISTRATION_TOKEN:-}"
      GATEWAY_INSTANCE_ADDRESS: "server:8090"
      GATEWAY_STAGE: "${GATEWAY_STAGE:-release}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        kanyue-server superuser upsert "$${PB_EMAIL}" "$${PB_PASSWORD}" --dir=/pb_data
        exec kanyue-server serve --http=0.0.0.0:8090 --dir=/pb_data
    volumes:
      - "${PB_DATA_SOURCE:-pocketbase_data}:/pb_data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The API gateway that replaces the Aliyun API gateway at cutover; off unless started
  # with `--profile gateway`. OpenResty sends API traffic to the data plane (GATEWAY_PORT);
  # the admin plane and console stay on host loopback, reached over an SSH tunnel.
  gateway: &gateway
    profiles: ["gateway"]
    # Named so the standby runs exactly the image built for the gateway.
    image: kanyue-gateway:local
    build:
      context: ./kanyue.gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-1460}:1460"
      - "127.0.0.1:${GATEWAY_ADMIN_PORT:-1461}:1461"
    environment:
      GATEWAY_LISTEN: "0.0.0.0:1460"
      # Inside the container the admin plane binds every interface; the host publishes it on loopback only.
      GATEWAY_ADMIN_PUBLIC: "1"
      GATEWAY_REGISTRATION_TOKEN: "${GATEWAY_REGISTRATION_TOKEN:-}"
      # 32 characters; seals plugin secrets, consumer secrets and the PocketBase settings.
      GATEWAY_ENCRYPTION_KEY: "${GATEWAY_ENCRYPTION_KEY:-}"
      # Host OpenResty reaches the container through the Docker bridge.
      GATEWAY_TRUSTED_PROXIES: "${GATEWAY_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}"
      GATEWAY_LOG_SAMPLE: "${GATEWAY_LOG_SAMPLE:-0.1}"
      # 1: a release to RELEASE waits for a second identity's approval.
      GATEWAY_RELEASE_APPROVAL: "${GATEWAY_RELEASE_APPROVAL:-}"
    command: ["kanyue-gateway", "serve", "--http=0.0.0.0:1461", "--dir=/pb_data", "--encryptionEnv=GATEWAY_ENCRYPTION_KEY"]
    volumes:
      - "${GATEWAY_DATA_SOURCE:-gateway_data}:/pb_data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1461/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    # The data plane drains in-flight requests for up to 10s on SIGTERM.
    stop_grace_period: 30s

  # Carries traffic while the gateway is recreated (scripts/gateway-rollout.mjs): same image
  # and data volume, OpenResty lists it as the `backup` upstream. Runs only during a rollout.
  gateway-standby:
    <<: *gateway
    profiles: ["gateway-standby"]
    restart: "no"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GATEWAY_STANDBY_PORT:-1470}:1460"
      - "127.0.0.1:${GATEWAY_STANDBY_ADMIN_PORT:-1471}:1461"

  miniapp:
    profiles: ["test"]
    build:
      context: ./ikanyue.taro3
      dockerfile: Dockerfile.local
    restart: unless-stopped
    working_dir: /app
    environment:
      CI: "true"
      NODE_ENV: development
      KANYUE_LOCAL_API_URL: "${KANYUE_LOCAL_API_URL:-http://127.0.0.1:1337}"
      CHOKIDAR_USEPOLLING: "true"
    command: /bin/sh -c "pnpm install --store-dir /pnpm/store --frozen-lockfile && exec pnpm run dev:weapp"
    volumes:
      - ./ikanyue.taro3:/app
      - miniapp_node_modules:/app/node_modules
      - miniapp_pnpm_store:/pnpm/store
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/dist/app.json"]
      interval: 3s
      timeout: 2s
      retries: 40

volumes:
  pocketbase_data:
  gateway_data:
  miniapp_node_modules:
  miniapp_pnpm_store:
